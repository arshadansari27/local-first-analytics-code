# Local BI stack: Evidence.dev dev server + Metabase
#
# Notes on the Evidence container:
#   `evidencedev/devenv` is the official Evidence development environment image.
#   It expects an Evidence project mounted at /evidence-workspace and (on first
#   run inside an empty workspace) bootstraps from the official template.
#   See https://github.com/evidence-dev/docker-devenv for details.

services:
  # ----------------------------------------
  # Evidence.dev (Reports as Code)
  # ----------------------------------------
  evidence:
    image: evidencedev/devenv:latest
    container_name: local-evidence
    ports:
      - "3000:3000"
    volumes:
      - ../evidence:/evidence-workspace
      - ../../data:/data
    environment:
      - HOST=0.0.0.0
    networks:
      - bi-net
    restart: unless-stopped

  # ----------------------------------------
  # Metabase (Ad-hoc Analytics)
  # ----------------------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: local-metabase
    ports:
      - "3001:3000"
    volumes:
      - metabase-data:/metabase-data
      - ../../data:/data
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - MB_SITE_URL=http://localhost:3001
    networks:
      - bi-net
    restart: unless-stopped

networks:
  bi-net:
    driver: bridge

volumes:
  metabase-data:
