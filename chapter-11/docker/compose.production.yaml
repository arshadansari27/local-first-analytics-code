version: '3.8'

# Production deployment with Caddy reverse proxy

services:
  evidence:
    image: evidence-dev/evidence:latest
    volumes:
      - ../evidence:/evidence
      - ../../data:/data
    ports:
      - "80:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  metabase:
    image: metabase/metabase:latest
    volumes:
      - metabase-data:/metabase-data
      - ../../data:/data
    ports:
      - "3001:3000"
    restart: unless-stopped
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - MB_SITE_URL=http://your-vps-ip:3001
      - MB_JETTY_HOST=0.0.0.0

  caddy:
    image: caddy:latest
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  metabase-data:
  caddy-data:
  caddy-config:
