# Production deployment: Evidence (built statically and served by Caddy)
# + Metabase + Caddy reverse proxy with automatic HTTPS.
#
# Evidence is most reliably deployed in production as a static build served by
# any static host. Here we build inside the `evidencedev/devenv` image and let
# Caddy serve the resulting `./build` directory.

services:
  evidence-build:
    image: evidencedev/devenv:latest
    volumes:
      - ../evidence:/evidence-workspace
      - ../../data:/data
    environment:
      - HOST=0.0.0.0
    # Build static site then exit. Run on demand: `docker compose run evidence-build`.
    command: ["sh", "-lc", "cd /evidence-workspace && npm install && npm run sources && npm run build"]
    profiles: ["build"]

  metabase:
    image: metabase/metabase:latest
    volumes:
      - metabase-data:/metabase-data
      - ../../data:/data
    ports:
      - "3001:3000"
    restart: unless-stopped
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - MB_SITE_URL=https://metabase.yourdomain.com
      - MB_JETTY_HOST=0.0.0.0

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../evidence/build:/srv/evidence:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  metabase-data:
  caddy-data:
  caddy-config:
