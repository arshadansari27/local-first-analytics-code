version: '3.8'

services:
  # ────────────────────────────────────────
  # Analytics Workspace (Python + DuckDB)
  # ────────────────────────────────────────
  analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-analytics
    working_dir: /workspace
    volumes:
      - ./data:/workspace/data
      - ./etl:/workspace/etl
      - ./sql:/workspace/sql
      - ./notebooks:/workspace/notebooks
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT_URL=http://minio:9000
      - PREFECT_API_URL=http://prefect:4200/api
    command: tail -f /dev/null
    depends_on:
      - minio
      - prefect
    networks:
      - analytics-net
    stdin_open: true
    tty: true

  # ────────────────────────────────────────
  # MinIO (S3-compatible storage)
  # ────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: local-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - analytics-net

  # ────────────────────────────────────────
  # Prefect Server (orchestration)
  # ────────────────────────────────────────
  prefect:
    image: prefecthq/prefect:2-python3.11
    container_name: local-prefect
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/root/.prefect
      - ./etl:/workspace/etl
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
    command: prefect server start --host 0.0.0.0
    networks:
      - analytics-net

  # ────────────────────────────────────────
  # Evidence (BI dashboards)
  # ────────────────────────────────────────
  evidence:
    image: node:18-alpine
    container_name: local-evidence
    working_dir: /evidence
    ports:
      - "3000:3000"
    volumes:
      - ./bi/evidence:/evidence
    command: |
      sh -c "
      if [ ! -f package.json ]; then
        npm init -y &&
        npm install @evidence-dev/evidence
      fi &&
      npx evidence dev --host 0.0.0.0
      "
    networks:
      - analytics-net

networks:
  analytics-net:
    driver: bridge

volumes:
  minio-data:
  prefect-data:
