services:
  # ────────────────────────────────────────
  # Analytics Workspace (Python + DuckDB)
  # ────────────────────────────────────────
  analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-analytics
    working_dir: /workspace
    volumes:
      - ./data:/workspace/data
      - ./etl:/workspace/etl
      - ./sql:/workspace/sql
      - ./notebooks:/workspace/notebooks
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT_URL=http://minio:9000
      - PREFECT_API_URL=http://prefect:4200/api
    command: tail -f /dev/null
    depends_on:
      - minio
      - prefect
    networks:
      - analytics-net
    stdin_open: true
    tty: true

  # ────────────────────────────────────────
  # MinIO (S3-compatible storage)
  # Note: MinIO archived their repo April 2026 and stopped publishing
  # to Docker Hub in October 2025. quay.io/minio/minio still serves
  # the final community binary (read-only registry). Pin a tag for
  # reproducibility; for a maintained alternative see SeaweedFS or
  # Garage.
  # ────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: local-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - analytics-net

  # ────────────────────────────────────────
  # Prefect Server (orchestration)
  # ────────────────────────────────────────
  prefect:
    image: prefecthq/prefect:3-python3.12
    container_name: local-prefect
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/root/.prefect
      - ./etl:/workspace/etl
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
    command: prefect server start --host 0.0.0.0
    networks:
      - analytics-net

  # ────────────────────────────────────────
  # Evidence (BI dashboards)
  # ────────────────────────────────────────
  evidence:
    # Node 20 went EOL on 24 Mar 2026; pin to a still-supported LTS.
    image: node:22-alpine
    container_name: local-evidence
    working_dir: /evidence
    ports:
      - "3000:3000"
    volumes:
      - ./bi/evidence:/evidence
    command: |
      sh -c "
      if [ ! -f package.json ]; then
        npm init -y &&
        npm install @evidence-dev/evidence
      fi &&
      npx evidence dev --host 0.0.0.0
      "
    networks:
      - analytics-net

networks:
  analytics-net:
    driver: bridge

volumes:
  minio-data:
  prefect-data:
